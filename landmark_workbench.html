<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>World Explorer — 40 Landmarks 3-View (三视图 + 轴测) Experimental Workbench</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141820;
      color: #e8eef5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: rgba(16, 20, 28, 0.94);
      border-bottom: 1px solid #2c3545;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
      z-index: 20;
    }
    #topbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #7cc4ff;
    }
    select, button {
      background: #1e2634;
      color: #e8eef5;
      border: 1px solid #3a4659;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #stats {
      font-size: 12px;
      color: #a6b4c8;
      margin-left: auto;
      font-family: monospace;
    }
    #canvas-wrap {
      position: absolute;
      top: 44px;
      left: 0;
      width: 1600px;
      height: 956px;
    }
    canvas {
      display: block;
      width: 1600px;
      height: 956px;
    }
    .vp-label {
      position: absolute;
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid #364256;
      color: #ffd479;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }
    #lbl-front { top: 54px; left: 12px; }
    #lbl-side  { top: 54px; left: 812px; }
    #lbl-top   { top: 532px; left: 12px; }
    #lbl-iso   { top: 532px; left: 812px; }
    #divider-v {
      position: absolute;
      top: 44px;
      left: 800px;
      width: 2px;
      height: 956px;
      background: #2c3545;
      pointer-events: none;
      z-index: 9;
    }
    #divider-h {
      position: absolute;
      top: 522px;
      left: 0;
      width: 1600px;
      height: 2px;
      background: #2c3545;
      pointer-events: none;
      z-index: 9;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>🏛️ World Explorer — 地标建筑三视图工作台 (3-View Orthographic + Isometric Workbench)</h1>
    <select id="lm-select"></select>
    <button id="btn-prev">◀ 上一个</button>
    <button id="btn-next">下一个 ▶</button>
    <button id="btn-night">🌙 切换日/夜发光</button>
    <div id="stats">Loading...</div>
  </div>

  <div id="lbl-front" class="vp-label">① 正视图 Front Elevation (South → North, -Z)</div>
  <div id="lbl-side"  class="vp-label">② 侧视图 Side Elevation (East → West, -X)</div>
  <div id="lbl-top"   class="vp-label">③ 俯视图 Top Plan View (+Y → -Y)</div>
  <div id="lbl-iso"   class="vp-label">④ 45° 轴测透视图 Isometric 3D View</div>
  <div id="divider-v"></div>
  <div id="divider-h"></div>

  <div id="canvas-wrap">
    <canvas id="wb-canvas" width="1600" height="956"></canvas>
  </div>

  <script type="module">
    import * as THREE from './vendor/three.module.js';
    import { LANDMARKS_40, buildLandmarkGeometryArrays } from './src/landmarks_40.js';

    const canvas = document.getElementById('wb-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1600, 956, false);
    renderer.setPixelRatio(1);
    renderer.setScissorTest(true);

    const scene = new THREE.Scene();

    // Lighting
    const ambLight = new THREE.AmbientLight(0xd8e4f8, 1.05);
    scene.add(ambLight);
    const dirLight1 = new THREE.DirectionalLight(0xfff4dc, 1.45);
    dirLight1.position.set(160, 280, 220);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x8ab4f8, 0.65);
    dirLight2.position.set(-180, 140, -160);
    scene.add(dirLight2);

    // Custom material supporting normal-length=2.0 emissive decoding
    let nightMode = false;
    const nightUniforms = { uNightEmissive: { value: 0.18 } };
    const bldgMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.52,
      metalness: 0.15,
      flatShading: false,
      side: THREE.DoubleSide,
    });
    bldgMat.onBeforeCompile = (shader) => {
      shader.uniforms.uNightEmissive = nightUniforms.uNightEmissive;
      shader.vertexShader =
        `varying float vEmissive;\n` +
        shader.vertexShader.replace(
          '#include <beginnormal_vertex>',
          `#include <beginnormal_vertex>
           vEmissive = step(1.5, length(objectNormal));
           objectNormal = normalize(objectNormal);`
        );
      shader.fragmentShader =
        `uniform float uNightEmissive;\nvarying float vEmissive;\n` +
        shader.fragmentShader.replace(
          'vec3 totalEmissiveRadiance = emissive;',
          'vec3 totalEmissiveRadiance = emissive + vColor * vEmissive * uNightEmissive;'
        );
    };

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const helperGroup = new THREE.Group();
    scene.add(helperGroup);

    // Populate select
    const sel = document.getElementById('lm-select');
    LANDMARKS_40.forEach((lm, idx) => {
      const opt = document.createElement('option');
      opt.value = lm.id;
      const batchNum = String(Math.floor(idx / 4) + 1).padStart(2, '0');
      opt.textContent = `[B${batchNum} #${idx + 1}] ${lm.nameZh} (${lm.id}) — H:${lm.height}m`;
      sel.appendChild(opt);
    });

    function buildReferenceGrid(spanXZ, maxY) {
      while (helperGroup.children.length > 0) {
        const c = helperGroup.children.pop();
        if (c.geometry) c.geometry.dispose();
      }
      // Ground plane y = 0 grid
      const gridSize = Math.ceil((spanXZ * 1.35) / 20) * 20;
      const divisions = Math.max(4, Math.min(40, Math.round(gridSize / 10)));
      const grid = new THREE.GridHelper(gridSize, divisions, 0xff5555, 0x2a3648);
      grid.position.y = 0;
      helperGroup.add(grid);

      // Ground plane y = 0 axes lines
      const axMatX = new THREE.LineBasicMaterial({ color: 0xff4444 });
      const axGeoX = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-gridSize * 0.5, 0.05, 0),
        new THREE.Vector3(gridSize * 0.5, 0.05, 0),
      ]);
      helperGroup.add(new THREE.Line(axGeoX, axMatX));

      const axMatZ = new THREE.LineBasicMaterial({ color: 0x44ccff });
      const axGeoZ = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0.05, -gridSize * 0.5),
        new THREE.Vector3(0, 0.05, gridSize * 0.5),
      ]);
      helperGroup.add(new THREE.Line(axGeoZ, axMatZ));
    }

    let currentLm = LANDMARKS_40[0];
    let currentStats = {};

    function renderLandmarkById(id, isNight = null) {
      if (isNight !== null) {
        nightMode = Boolean(isNight);
        nightUniforms.uNightEmissive.value = nightMode ? 0.92 : 0.18;
        ambLight.intensity = nightMode ? 0.35 : 1.05;
        dirLight1.intensity = nightMode ? 0.35 : 1.45;
      }
      const idx = LANDMARKS_40.findIndex((x) => x.id === id);
      const lm = idx >= 0 ? LANDMARKS_40[idx] : LANDMARKS_40[0];
      currentLm = lm;
      sel.value = lm.id;

      while (modelGroup.children.length > 0) {
        const c = modelGroup.children.pop();
        if (c.geometry) c.geometry.dispose();
      }

      // Build landmark centered at (0, 0, 0) by passing groundY = 0 and translating (-lm.cx, 0, -lm.cz)
      const arrs = buildLandmarkGeometryArrays(lm, 0);
      const geom = new THREE.BufferGeometry();
      geom.setIndex(new THREE.BufferAttribute(arrs.indices, 1));

      // Recenter positions around (-lm.cx, 0, -lm.cz) and compute exact bounding box & ground contact stats
      const pos = new Float32Array(arrs.positions.length);
      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;
      let minZ = Infinity, maxZ = -Infinity;
      let groundVerts = 0;
      let emissiveVerts = 0;

      for (let i = 0; i < arrs.positions.length; i += 3) {
        const x = arrs.positions[i] - lm.cx;
        const y = arrs.positions[i + 1];
        const z = arrs.positions[i + 2] - lm.cz;
        pos[i] = x;
        pos[i + 1] = y;
        pos[i + 2] = z;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
        if (Math.abs(y) <= 1.5) groundVerts++;
        const nx = arrs.normals[i], ny = arrs.normals[i + 1], nz = arrs.normals[i + 2];
        if (Math.hypot(nx, ny, nz) > 1.5) emissiveVerts++;
      }

      geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geom.setAttribute('normal', new THREE.BufferAttribute(arrs.normals, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(arrs.colors, 3, true));

      const mesh = new THREE.Mesh(geom, bldgMat);
      modelGroup.add(mesh);

      const spanX = Math.max(10, maxX - minX);
      const spanY = Math.max(10, maxY - minY);
      const spanZ = Math.max(10, maxZ - minZ);
      const spanXZ = Math.max(spanX, spanZ);
      const centerX = (minX + maxX) * 0.5;
      const centerY = (minY + maxY) * 0.5;
      const centerZ = (minZ + maxZ) * 0.5;

      buildReferenceGrid(spanXZ, spanY);

      currentStats = {
        id: lm.id,
        nameZh: lm.nameZh,
        nameEn: lm.nameEn,
        batchIndex: Math.floor((idx >= 0 ? idx : 0) / 4) + 1,
        vertexCount: pos.length / 3,
        triangleCount: arrs.indices.length / 3,
        emissiveVertices: emissiveVerts,
        groundContactVertices: groundVerts,
        bbox: {
          minX: Number(minX.toFixed(2)),
          maxX: Number(maxX.toFixed(2)),
          minY: Number(minY.toFixed(2)),
          maxY: Number(maxY.toFixed(2)),
          minZ: Number(minZ.toFixed(2)),
          maxZ: Number(maxZ.toFixed(2)),
          widthX: Number(spanX.toFixed(2)),
          heightY: Number(spanY.toFixed(2)),
          depthZ: Number(spanZ.toFixed(2)),
        },
        targetHeight: lm.height,
        floatingWarning: minY > 0.5,
      };

      document.getElementById('stats').textContent =
        `${lm.nameZh} (${lm.id}) | Verts: ${currentStats.vertexCount} | Tris: ${currentStats.triangleCount} | ` +
        `BBox: ${currentStats.bbox.widthX}m(X) × ${currentStats.bbox.depthZ}m(Z) × ${currentStats.bbox.heightY}m(Y) ` +
        `[minY=${currentStats.bbox.minY}m, targetH=${lm.height}m] | Emissive: ${emissiveVerts}`;

      // Render 4 viewports (800 x 478 each)
      const vpW = 800;
      const vpH = 478;
      const aspect = vpW / vpH;
      const bgCol = nightMode ? 0x090d16 : 0x161c26;
      renderer.setClearColor(bgCol, 1);

      // 1. Top-Left (y=478..956 in WebGL bottom-up coordinates): Front Elevation (+Z looking -Z)
      {
        const halfH = Math.max(spanY * 0.62, (spanX / aspect) * 0.62);
        const halfW = halfH * aspect;
        const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 1, 4000);
        cam.position.set(centerX, centerY, maxZ + 800);
        cam.lookAt(centerX, centerY, centerZ);
        renderer.setViewport(0, vpH, vpW, vpH);
        renderer.setScissor(0, vpH, vpW, vpH);
        renderer.render(scene, cam);
      }

      // 2. Top-Right (x=800..1600, y=478..956): Side Elevation (+X looking -X)
      {
        const halfH = Math.max(spanY * 0.62, (spanZ / aspect) * 0.62);
        const halfW = halfH * aspect;
        const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 1, 4000);
        cam.position.set(maxX + 800, centerY, centerZ);
        cam.lookAt(centerX, centerY, centerZ);
        renderer.setViewport(vpW, vpH, vpW, vpH);
        renderer.setScissor(vpW, vpH, vpW, vpH);
        renderer.render(scene, cam);
      }

      // 3. Bottom-Left (x=0..800, y=0..478): Top Plan View (+Y looking -Y)
      {
        const halfH = Math.max(spanZ * 0.62, (spanX / aspect) * 0.62);
        const halfW = halfH * aspect;
        const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 1, 4000);
        cam.position.set(centerX, maxY + 800, centerZ);
        cam.up.set(0, 0, -1);
        cam.lookAt(centerX, 0, centerZ);
        renderer.setViewport(0, 0, vpW, vpH);
        renderer.setScissor(0, 0, vpW, vpH);
        renderer.render(scene, cam);
      }

      // 4. Bottom-Right (x=800..1600, y=0..478): 3D Perspective / Isometric View
      {
        const cam = new THREE.PerspectiveCamera(38, aspect, 1, 5000);
        const dist = Math.max(spanXZ, spanY) * 1.55;
        cam.position.set(centerX + dist * 0.78, centerY + dist * 0.58, centerZ + dist * 0.88);
        cam.lookAt(centerX, centerY * 0.85, centerZ);
        renderer.setViewport(vpW, 0, vpW, vpH);
        renderer.setScissor(vpW, 0, vpW, vpH);
        renderer.render(scene, cam);
      }

      return currentStats;
    }

    sel.addEventListener('change', () => renderLandmarkById(sel.value));
    document.getElementById('btn-prev').addEventListener('click', () => {
      const idx = LANDMARKS_40.findIndex((x) => x.id === currentLm.id);
      const nextIdx = (idx - 1 + LANDMARKS_40.length) % LANDMARKS_40.length;
      renderLandmarkById(LANDMARKS_40[nextIdx].id);
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      const idx = LANDMARKS_40.findIndex((x) => x.id === currentLm.id);
      const nextIdx = (idx + 1) % LANDMARKS_40.length;
      renderLandmarkById(LANDMARKS_40[nextIdx].id);
    });
    document.getElementById('btn-night').addEventListener('click', () => {
      renderLandmarkById(currentLm.id, !nightMode);
    });

    const params = new URLSearchParams(window.location.search);
    const initId = params.get('id') || LANDMARKS_40[0].id;
    const initNight = params.get('night') === '1';
    renderLandmarkById(initId, initNight);

    window.__WORKBENCH__ = {
      renderLandmarkById,
      getLandmarks: () => LANDMARKS_40.map((l) => ({ id: l.id, nameZh: l.nameZh, nameEn: l.nameEn, height: l.height })),
      getCurrentStats: () => currentStats,
    };
  </script>
</body>
</html>
